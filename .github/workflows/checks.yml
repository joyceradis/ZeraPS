name: checks

on:
  pull_request:
  push:
    branches:
      - '**'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Verify legacy runtime
        run: npm run verify
      - name: Verify Zera PS 2.0
        run: npm run v2:verify
